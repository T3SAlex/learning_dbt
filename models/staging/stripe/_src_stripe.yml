version: 2

sources:
  - name: stripe
    description: A clone of a Postgres database
    database: raw
    tables:
      - name: payment
        description: Raw payments data
        config:
          loaded_at_field: _batched_at
          freshness:
            warn_after: {count: 12, period: hour}
            error_after: {count: 999, period: day}